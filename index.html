<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join Salman and Ameena as they celebrate their wedding on October 11, 2026.">
    <title>Salman & Ameena | Wedding Invitation</title>
    <meta property="og:title" content="Salman & Ameena | Wedding Invitation">
    <meta property="og:description" content="Join Salman and Ameena as they celebrate their wedding on October 11, 2026.">
    <meta property="og:url" content="https://farizii-ameena.rf.gd/">
    <meta property="og:image" content="https://farizii-ameena.rf.gd/images/preview.jpeg">
    <meta property="og:image:secure_url" content="https://farizii-ameena.rf.gd/images/preview.jpeg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Salman and Ameena">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Salman & Ameena | Wedding Invitation">
    <meta name="twitter:description" content="Join Salman and Ameena as they celebrate their wedding on October 11, 2026.">
    <meta name="twitter:image" content="https://farizii-ameena.rf.gd/images/preview.jpeg">
    <meta name="twitter:image:alt" content="Salman and Ameena">
    <link rel="canonical" href="https://farizii-ameena.rf.gd/">
    <link rel="stylesheet" href="style.css">
    <!-- p5.js Core Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>

    <!-- =========================================================
         SCREEN 1: ENVELOPE ENTRANCE 
         ========================================================= -->
    <div id="screen-envelope" class="screen active">
        <!-- Corner Decorations -->
        <img src="images/bow-tl.png" class="decor-corner decor-tl" alt="Bow Top Left">
        <img src="images/heart-tr.png" class="decor-corner decor-tr" alt="Heart Top Right">
        <img src="images/heart-bl.png" class="decor-corner decor-bl" alt="Heart Bottom Left">
        <img src="images/bow-br.png" class="decor-corner decor-br" alt="Bow Bottom Right">

        <div class="invitation-container">
            <div class="envelope-assembly" id="envelopeAssembly">
                <img src="images/card-bg.png" alt="Card Background" class="layer card-bg">
                <img src="images/letter.png" alt="Invitation Letter" class="layer letter-sheet">
                <img src="images/envelope-back.png" alt="Envelope" class="layer envelope-base">
                <img src="images/envelope-front.png" alt="Envelope" class="layer envelope-base-1">
                <button class="open-btn" onclick="openInvitation()">OPEN</button>
            </div>
            <img src="images/couple-photo.png" alt="Couples Photo" class="layer couple-polaroid" id="couplePolaroid">
        </div>
    </div>


    <!-- =========================================================
         SCREEN 2: DETAILS PAGE
         ========================================================= -->
    <div id="screen-details" class="screen">
        
        <div class="details-scroll-container">
            
            <!-- 1. The Locket Component (Full screen-width drop layout) -->
            <div class="locket-stage">
                <img src="images/locket-frame.png" alt="Locket Frame" class="falling-locket" id="fallingLocket">
            </div>

            <!-- 2. The Text Elements (Scroll reveal architecture) -->
            <div class="details-wrapper">
                
                <!-- 🌟 Added id="weddingNamesBlock" here so JavaScript can hold its reveal until the bounce ends -->
                <section class="wedding-names scroll-reveal" id="weddingNamesBlock">
                    <h1 class="couple-title">Farizi & Ameena</h1>
                </section>
                
                <!-- Future content containers can be placed safely right below this point -->
                <section class="wedding-header scroll-reveal">
                    <h2>Save The Date</h2>
                    <p>Together with their families, they invite you to celebrate...</p>
                </section>
                
            </div>
            
        </div>

    </div>

    <!-- Core Logic Systems Script -->
    <script src="script.js"></script>
</body>
</html>
